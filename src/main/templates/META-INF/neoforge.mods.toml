# Mod metadata for Oritech Smart Splitter.
# Format is standard TOML, v0.5.0.

modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="https://github.com/Xiao232ming/Oritech-Smart-Splitter/issues" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

#logoFile="oritechsplitter.png" #optional

# A text field displayed in the mod UI
credits="Backport of the Smart Splitter from Oritech 2.0.0 (Minecraft 26.1.2) by Rearth. Oritech is licensed CC0-1.0."

authors="Xiao232ming"

description='''
Backports Oritech's Smart Splitter to Minecraft 1.21.1.

The Smart Splitter is a small item buffer that distributes items evenly between its horizontal
outputs. It stores one stack at a time, so it cannot mix different item types. Sides are learned
automatically and it works through the standard NeoForge item handler capability, so Oritech's item
pipes, hoppers and other item transfer systems can all interact with it.

Requires Oritech, which supplies the recipe ingredients and the item pipes this block is built for.
'''

# Oritech is a hard requirement: the recipe consumes oritech:item_pipe and oritech:item_filter_block,
# and the block is designed to be driven by Oritech's item pipes.
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    # Oritech 1.21.1 itself requires NeoForge 21.1.200 or newer.
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="oritech"
    type="required"
    versionRange="${oritech_version_range}"
    # Load after Oritech so its item pipes and creative tabs already exist when this mod initialises.
    ordering="AFTER"
    side="BOTH"
