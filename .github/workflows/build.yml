name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # The game tests need Oritech and its own dependencies present in run/mods.
      - name: Stage runtime mods and run game tests
        run: |
          ./gradlew syncTestModsFromMaven
          ./gradlew runGameTestServer

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: oritechsplitter-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
