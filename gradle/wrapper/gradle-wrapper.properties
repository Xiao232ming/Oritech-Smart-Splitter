# Gradle distribution.
#
# This points at a mirror because services.gradle.org is not usable from some networks: it answers
# small requests but stalls on the distribution itself. The checksum below is Gradle's official one
# and matches the mirror file byte for byte, so switching the host back is safe and verified:
#   distributionUrl=https\://services.gradle.org/distributions/gradle-9.2.1-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.2.1-bin.zip
distributionSha256Sum=72f44c9f8ebcb1af43838f45ee5c4aa9c5444898b3468ab3f4af7b6076c5bc3f
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
